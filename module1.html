<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA Académie - Introduction à l'IA</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #020024 0%, #0030CB 100%);
            --cta-gradient: linear-gradient(90deg, #0055FF 0%, #00F0FF 100%);
            --text-main: #FFFFFF;
            --text-secondary: #E0E0E0;
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --accent-color: #a5b4fc;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
        }

        a { text-decoration: none; color: inherit; transition: 0.3s; }
        ul { list-style: none; }

        /* --- NAVBAR --- */
        .navbar {
            background: rgba(0, 8, 20, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--glass-border);
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(to right, #fff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links { display: flex; gap: 30px; }
        .nav-links a { font-size: 0.95rem; font-weight: 400; opacity: 0.7; }
        .nav-links a:hover { opacity: 1; text-shadow: 0 0 10px rgba(255,255,255,0.5); }
        .nav-links a.active {
            opacity: 1;
            color: #00F0FF;
            font-weight: 600;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }

        .hamburger { display: none; cursor: pointer; font-size: 1.8rem; color: white; }

        /* --- COMING SOON --- */
        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 100px 20px;
            text-align: center;
        }

        .badge {
            display: inline-block;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 6px 18px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--accent-color);
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 20px;
            background: linear-gradient(to right, #ffffff, #dbe4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--text-secondary);
            font-weight: 300;
            line-height: 1.7;
            margin-bottom: 50px;
        }

        .cta-button {
            display: inline-block;
            padding: 14px 32px;
            background: var(--cta-gradient);
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.95rem;
            color: white;
            transition: opacity 0.3s, transform 0.3s;
        }
        .cta-button:hover { opacity: 0.85; transform: translateY(-2px); }

        /* --- FOOTER --- */
        footer {
            text-align: center;
            padding: 30px;
            color: rgba(255,255,255,0.3);
            font-size: 0.85rem;
            border-top: 1px solid var(--glass-border);
            margin-top: 60px;
        }

        /* --- MOBILE --- */
        @media (max-width: 768px) {
            .hamburger { display: block; }
            .nav-links {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 70px; left: 0; right: 0;
                background: rgba(0, 8, 20, 0.97);
                padding: 20px 30px;
                gap: 15px;
                border-bottom: 1px solid var(--glass-border);
            }
            .nav-links.active { display: flex; }
            h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="logo">IA Académie</a>
        <div class="hamburger" onclick="toggleMenu()">☰</div>
        <ul class="nav-links" id="navLinks">
            <li><a href="module1.html" class="active">Intro IA</a></li>
            <li><a href="card-game.html">Éthique</a></li>
            <li><a href="atelier.html">Atelier</a></li>
            <li><a href="prompting.html">Prompting</a></li>
            <li><a href="agentique.html">Agentique</a></li>
        </ul>
    </nav>

    <div class="container">
        <span class="badge">En cours de création</span>
        <h1>Introduction à l'IA</h1>
        <p class="subtitle">
            Fondamentaux, définitions et impact sur le monde du travail.<br>
            Ce module sera disponible prochainement.
        </p>
        <a href="index.html" class="cta-button">← Retour au programme</a>
    </div>

    <footer>
        <p>© 2026 IA Académie - Salesforce</p>
    </footer>

    <script>
        function toggleMenu() {
            document.getElementById('navLinks').classList.toggle('active');
        }
    </script>
</body>
</html>
